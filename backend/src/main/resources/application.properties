server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

ai.service.base-url=${AI_SERVICE_URL:http://localhost:5000}

translation.provider=libretranslate
translation.libretranslate.url=${TRANSLATION_URL:http://localhost:5001/translate}

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/leaf-photos

app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000}